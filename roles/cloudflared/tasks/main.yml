---
# Cloudflared role - Cloudflare Tunnel setup

- name: Add Cloudflare GPG key
  apt_key:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    state: present

- name: Add Cloudflare repository
  apt_repository:
    repo: "deb https://pkg.cloudflare.com/cloudflared {{ ansible_distribution_release }} main"
    state: present
    filename: cloudflared

- name: Install cloudflared
  apt:
    name: cloudflared
    state: present
    update_cache: yes

- name: Create cloudflared config directory
  file:
    path: /etc/cloudflared
    state: directory
    mode: '0755'

- name: Configure cloudflared
  template:
    src: config.yml.j2
    dest: /etc/cloudflared/config.yml
    mode: '0600'
  notify: restart cloudflared
  when: cloudflare_tunnel_token is defined

- name: Install cloudflared service
  systemd:
    name: cloudflared
    enabled: yes
    state: started
    daemon_reload: yes
